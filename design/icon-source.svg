<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Ícone do PlanilhaLivre: uma grade de planilha de verdade, não um monograma
    solto num fundo liso. Fundo azul da marca (mesmo tom do theme_color do PWA),
    grade branca com traço grosso pra ficar legível pequeno, uma linha de cabeçalho
    mais escura (como numa planilha real) e uma célula em branco com um "cursor"
    de texto dentro — a célula que você está editando agora.
  -->
  <rect width="512" height="512" rx="88" fill="#2f6feb" />

  <!-- linha de cabeçalho (mais escura, como o cabeçalho de colunas de uma planilha) -->
  <rect x="104" y="152" width="304" height="64" fill="#1c4bb8" />

  <!-- contorno da grade -->
  <rect x="104" y="152" width="304" height="256" rx="8" fill="none" stroke="#ffffff" stroke-width="10" />

  <!-- linhas verticais -->
  <line x1="205.33" y1="152" x2="205.33" y2="408" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  <line x1="306.67" y1="152" x2="306.67" y2="408" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

  <!-- linhas horizontais -->
  <line x1="104" y1="216" x2="408" y2="216" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  <line x1="104" y1="312" x2="408" y2="312" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

  <!-- célula ativa (em branco) com cursor de texto -->
  <rect x="211" y="221" width="90.67" height="86" fill="#ffffff" />
  <rect x="228" y="238" width="7" height="52" rx="3" fill="#2f6feb" />
</svg>
