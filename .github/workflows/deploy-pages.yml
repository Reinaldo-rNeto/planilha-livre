# Publica o build de produção no GitHub Pages a cada push na main.
#
# Passo manual único, uma vez, no repositório: Settings > Pages > "Source" = "GitHub Actions".
# Sem isso o primeiro deploy fica travado esperando o Pages ser habilitado.
#
# --base=/planilha-livre/ é necessário porque um "project site" do GitHub Pages
# (usuario.github.io/planilha-livre/) serve os arquivos num subcaminho, não na raiz —
# sem isso os assets (JS/CSS/ícones) dão 404. Se o nome do repositório mudar, atualizar
# esse valor também.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/planilha-livre/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
